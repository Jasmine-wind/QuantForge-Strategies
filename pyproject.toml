[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantforge-strategies"
version = "0.1.0"
description = "Offline BTCUSDT perpetual historical backtests"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<4", "numpy>=1.26,<3", "pyarrow>=15,<25"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
qfs = "qfs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qfs = ["browser.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
